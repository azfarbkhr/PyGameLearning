<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>While exploring the Codex SDK</title>
<style>
:root{color-scheme:dark;--ink:#f4f1e8;--gold:#e0bd72}*{box-sizing:border-box}body{margin:0;background:#101923;color:var(--ink);font-family:Georgia,"Times New Roman",serif}.wrap{min-height:100svh;display:grid;place-items:center;padding:20px}.slide{position:relative;width:min(78vw,640px);aspect-ratio:4/5;overflow:hidden;isolation:isolate;background:#1b2937}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-2}.slide:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,15,24,.24) 0%,rgba(8,15,24,.26) 30%,rgba(8,15,24,.8) 58%,rgba(8,15,24,.95) 100%)}.slide.has-detail:after{background:linear-gradient(180deg,rgba(8,15,24,.38),rgba(8,15,24,.48) 43%,rgba(8,15,24,.91) 66%,rgba(8,15,24,.97))}.detail{display:none;position:absolute;top:8%;left:5%;width:90%;height:49%;object-fit:contain;filter:drop-shadow(0 6px 18px #0009)}.has-detail .detail{display:block}.copy{position:absolute;left:8%;right:8%;bottom:8%;text-shadow:0 2px 12px #000}.slide.final .copy{top:50%;bottom:auto;transform:translateY(-50%);text-align:center}.slide.final .copy p{margin-inline:auto}.copy h1{font-size:clamp(28px,5vw,52px);line-height:1.14;margin:0 0 18px;font-weight:700}.copy p{white-space:pre-line;font:clamp(16px,2.25vw,22px)/1.42 "Segoe UI",Arial,sans-serif;margin:0;max-width:50ch}.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;font:14px "Segoe UI",Arial,sans-serif}.nav button{border:1px solid #718092;background:#1a2938;color:white;padding:10px 15px;border-radius:24px;font:inherit;cursor:pointer}.nav button:hover{border-color:var(--gold)}#count{color:#d6dce4;min-width:38px;text-align:center} @media(max-width:600px){.wrap{padding:10px 10px 68px}.slide{width:min(94vw,520px)}.detail{top:7%;height:46%}.copy{bottom:6%}.nav{bottom:10px}.nav button{padding:9px 13px}}@media(min-width:1000px){.slide{width:min(68vh,720px)}}
</style></head>
<body><main class="wrap"><article class="slide" id="slide" aria-live="polite"><img class="background" id="background" src="assets/art-panorama.png" alt=""><img class="detail" id="detail" alt=""><div class="copy"><h1 id="heading"></h1><p id="body"></p></div></article></main>
<nav class="nav" aria-label="Carousel navigation"><button id="prev" aria-label="Previous slide">←</button><span id="count"></span><button id="next" aria-label="Next slide">→</button></nav>
<script>
const slides=[
{heading:'While exploring the Codex SDK, I wanted to test its limits.',body:'So I tried to make a game with #Codex and ChatGPT, and I made ChatGPT the brain of the game.',image:'art-panorama.png',position:'center'},
{heading:'I initially started by generating designs and story with the AI.',body:'',image:'art-battlefield.png',position:'center'},
{heading:'Players can discuss a battle plan with their allies.',body:'Players can use natural language to talk through a strategy with their team. Codex replies and turns the discussion into orders that guide the characters during battle.\n\nI’m still tweaking how this works.',image:'art-panorama.png',detail:'council-replay.png',position:'center'},
{heading:'Players can give their team commands during battle.',body:'Players can press T and speak naturally. Codex translates a few short commands into movement orders, and the team follows along. Other requests are not supported yet.\n\nI’m still working on this.',image:'art-panorama.png',detail:'battle-test.png',position:'center'},
{heading:'Codex also controls the enemy.',body:'Players can press E to talk with the enemy commander during battle.\n\nI’m still working on this interaction too.',image:'art-panorama.png',detail:'conversation-check.png',position:'center'},
{heading:'Do you have an idea that could make it better?',body:'The GitHub repository link is in the comments.\n\nComment with any ideas you have for improving the game.',image:'art-battlefield.png',position:'center'}
];let index=0;const img=document.querySelector('#background'),heading=document.querySelector('#heading'),body=document.querySelector('#body'),count=document.querySelector('#count');const detail=document.querySelector('#detail'),slide=document.querySelector('#slide');function show(){const s=slides[index];heading.textContent=s.heading;body.textContent=s.body;body.hidden=!s.body;img.src='assets/'+s.image;img.style.objectPosition=s.position||'center';slide.classList.toggle('has-detail',!!s.detail);slide.classList.toggle('final',index===slides.length-1);detail.src=s.detail?'assets/'+s.detail:'';detail.alt=s.detailAlt||'';count.textContent=`${index+1} / ${slides.length}`}function move(d){index=(index+d+slides.length)%slides.length;show()}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let startX=0;slide.addEventListener('touchstart',e=>startX=e.changedTouches[0].screenX,{passive:true});slide.addEventListener('touchend',e=>{const delta=e.changedTouches[0].screenX-startX;if(Math.abs(delta)>55)move(delta<0?1:-1)},{passive:true});show();
</script></body></html>
