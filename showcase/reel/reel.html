<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1350,initial-scale=1"><title>Learning to embed GenAI with Codex</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#101923;color:#f4f1e8;font-family:Georgia,"Times New Roman",serif}.stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:#101923}.scene{position:absolute;inset:0;opacity:0;visibility:hidden}.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.025);filter:brightness(.66)}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,20,.1) 5%,rgba(5,12,20,.08) 38%,rgba(5,12,20,.82) 66%,rgba(5,12,20,.96) 100%)}.scene.detail-scene:after{background:linear-gradient(180deg,rgba(5,12,20,.24),rgba(5,12,20,.1) 43%,rgba(5,12,20,.86) 65%,rgba(5,12,20,.97))}.detail{position:absolute;z-index:1;top:105px;left:52px;width:976px;height:670px;object-fit:contain;filter:drop-shadow(0 8px 20px #000a)}.copy{position:absolute;z-index:2;left:86px;right:86px;bottom:150px;opacity:0;transform:translateY(15px);text-shadow:0 2px 15px #000}.detail-scene .copy{bottom:74px}.heading{font-size:66px;line-height:1.13;margin:0 0 26px;font-weight:700;letter-spacing:-.4px}.body{font:31px/1.42 "Segoe UI",Arial,sans-serif;margin:0;white-space:pre-line;max-width:43ch}.last .copy{text-align:center;top:50%;bottom:auto;transform:translateY(-50%)}.last .body{margin:auto}.small-note{font:21px/1.5 "Segoe UI",Arial,sans-serif;color:#e5c779;margin-top:30px}.noshow{display:none}
</style></head><body><main class="stage" id="stage"></main>
<script src="node_modules/gsap/dist/gsap.min.js"></script><script>
const sceneData=[
 {seconds:11.55,bg:'assets/art-panorama.png',title:'While exploring the Codex SDK, I wanted to test its limits.',text:'So I tried making a game with Codex and ChatGPT, and using ChatGPT as the brain behind it.'},
 {seconds:4.55,bg:'assets/art-battlefield.png',title:'I started with AI generated designs and a story.',text:''},
 {seconds:10.55,bg:'assets/art-panorama.png',detail:'assets/council.png',title:'Players can discuss a battle plan with their allies.',text:'Players can use natural language to talk through a strategy with their team. Codex replies, and the discussion shapes orders that guide the characters during battle.\n\nI’m still tweaking how this works.'},
 {seconds:12.55,bg:'assets/art-panorama.png',detail:'assets/spoken-order-ui.png',title:'Players can give their team commands during battle.',text:'Players can press T and speak naturally. Codex translates a few short commands into movement orders, and the team follows along. Other requests are not supported yet.\n\nI’m still working on this.'},
 {seconds:4.05,bg:'assets/art-panorama.png',detail:'assets/codex-report.png',title:'Codex also plans for the enemy army in the background.',text:''},
 {seconds:4.05,bg:'assets/art-panorama.png',detail:'assets/ramsay-reply-ui.png',title:'Players can press E to talk with the enemy during battle.',text:'The fight pauses while the characters speak.'},
 {seconds:10.55,bg:'assets/art-battlefield.png',title:'Do you have an idea that could make it better?',text:'The GitHub repository link is in the comments.\n\nComment with any ideas you have for improving the game.',last:true}
];
const stage=document.querySelector('#stage');for(const [i,s]of sceneData.entries()){const el=document.createElement('section');el.className='scene'+(s.detail?' detail-scene':'')+(s.last?' last':'');el.innerHTML=`<img class="scene-bg" src="${s.bg}"><div class="copy"><h1 class="heading"></h1><p class="body"></p></div>`+(s.detail?`<img class="detail" src="${s.detail}">`:'');el.querySelector('.heading').textContent=s.title;el.querySelector('.body').textContent=s.text;stage.append(el);s.el=el}
let cursor=0;for(const s of sceneData){s.start=cursor;s.end=cursor+s.seconds;cursor=s.end-.55}window.REEL_DURATION=sceneData.at(-1).end;window.seekReel=t=>{t=Math.max(0,Math.min(window.REEL_DURATION,t));for(const s of sceneData){const fadeIn=gsap.parseEase('power1.out')(Math.max(0,Math.min(1,(t-s.start)/.65)));const fadeOut=Math.max(0,Math.min(1,(s.end-t)/.65));const alpha=Math.min(fadeIn,fadeOut);gsap.set(s.el,{autoAlpha:alpha});const progress=Math.max(0,Math.min(1,(t-s.start)/s.seconds));gsap.set(s.el.querySelector('.scene-bg'),{scale:1.015+.03*progress});const reveal=gsap.parseEase('power2.out')(Math.max(0,Math.min(1,(t-s.start-.22)/.75)));gsap.set(s.el.querySelector('.copy'),{autoAlpha:alpha*reveal,y:18*(1-reveal)});if(s.detail)gsap.set(s.el.querySelector('.detail'),{autoAlpha:alpha*Math.max(0,Math.min(1,(t-s.start-.08)/.7)),y:8*(1-reveal)})}};window.seekReel(0);
</script></body></html>
